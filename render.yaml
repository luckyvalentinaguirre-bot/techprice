# Render Blueprint: deploys the whole stack (Postgres + API + web) in one
# click from https://dashboard.render.com/blueprints -> "New Blueprint
# Instance", pointing at this repo/branch. Render auto-detects this file.
#
# Seeds illustrative demo data on API boot (packages/database/src/seedDemo.ts)
# since stores.config.ts has no verified/enabled real store yet — see README.
#
# NOTE: if Render renames a service because "techprice-api"/"techprice-web"
# is already taken, update API_CORS_ORIGIN and NEXT_PUBLIC_API_URL below (or
# in the dashboard) to match the actual assigned *.onrender.com hostnames.

databases:
  - name: techprice-db
    databaseName: techprice
    user: techprice
    plan: free

services:
  - type: web
    name: techprice-api
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: >-
      npx --yes pnpm@10.33.0 install --frozen-lockfile &&
      npx --yes pnpm@10.33.0 --filter @techprice/database build &&
      npx --yes pnpm@10.33.0 --filter @techprice/api build
    # Retries migrate:deploy in case the DB is still starting on the very
    # first boot; seed:demo is best-effort so a seeding hiccup never blocks
    # the API from serving.
    startCommand: >-
      ok="" ;
      for i in 1 2 3 4 5; do
        npx --yes pnpm@10.33.0 --filter @techprice/database migrate:deploy && ok=1 && break;
        sleep 5;
      done ;
      [ "$ok" = "1" ] &&
      (npx --yes pnpm@10.33.0 --filter @techprice/database seed:demo || true) &&
      npx --yes pnpm@10.33.0 --filter @techprice/api start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: techprice-db
          property: connectionString
      - key: API_CORS_ORIGIN
        value: https://techprice-web.onrender.com

  - type: web
    name: techprice-web
    runtime: node
    plan: free
    buildCommand: >-
      npx --yes pnpm@10.33.0 install --frozen-lockfile &&
      npx --yes pnpm@10.33.0 --filter @techprice/shared build &&
      npx --yes pnpm@10.33.0 --filter @techprice/web build
    startCommand: npx --yes pnpm@10.33.0 --filter @techprice/web start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://techprice-api.onrender.com
