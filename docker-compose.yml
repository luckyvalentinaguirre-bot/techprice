services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: techprice
      POSTGRES_PASSWORD: techprice
      POSTGRES_DB: techprice
    ports:
      - "5432:5432"
    volumes:
      - techprice_pgdata:/var/lib/postgresql/data

volumes:
  techprice_pgdata:
